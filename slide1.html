<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisão Estratégica para o Novo CD Magalu Nordeste</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Source Sans Pro', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        .slide {
            width: 1280px;
            height: 720px;
            position: relative;
            background: linear-gradient(rgba(20, 66, 114, 0.85), rgba(20, 66, 114, 0.85)), 
                        url('https://picsum.photos/seed/logistics-distribution-center/1280/720.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .content {
            text-align: center;
            max-width: 80%;
        }
        .title {
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 50px;
            opacity: 0.9;
        }
        .authors {
            font-size: 22px;
            margin-bottom: 15px;
        }
        .date {
            font-size: 20px;
            opacity: 0.8;
        }
        .logo-placeholder {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            align-items: center;
            font-size: 18px;
            opacity: 0.8;
        }
        .logo-placeholder i {
            margin-right: 10px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="content">
            <h1 class="title">Decisão Estratégica para o Novo CD Magalu Nordeste</h1>
            <p class="subtitle">Análise de Localização para Centro de Distribuição na Região Nordeste</p>
            <p class="date">Setembro/2025</p>
            <p class="authors">Lucas Gomes Leria</p>
            <small>Com apoio das IAs: ChatGPT, Gemini, Manus, GLM-4.5 e Cursor 
            <br> (versões gratuitas limitadas e para diferentes tarefas)<small>
        </div>
        <div class="logo-placeholder">
            <i class="material-icons">business</i>
            Magalu
        </div>
    </div>
</body>
</html>
